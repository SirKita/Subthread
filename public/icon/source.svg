<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rounded square with a superscript-style asterisk (footnote marker).
       Glyph is drawn geometrically (no fonts, no text) so it renders
       identically everywhere and stays readable at 16px. -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#6D5BD8"/>
  <g transform="translate(64 54)" fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round">
    <line x1="0" y1="-27" x2="0" y2="27"/>
    <line x1="-23.4" y1="-13.5" x2="23.4" y2="13.5"/>
    <line x1="-23.4" y1="13.5" x2="23.4" y2="-13.5"/>
  </g>
  <circle cx="64" cy="104" r="9" fill="#FFFFFF" opacity="0.85"/>
</svg>
